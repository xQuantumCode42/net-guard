[workspace]
members = ["crates/core", "crates/platform", "crates/control", "crates/agent", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/platform", "crates/control", "crates/agent"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
netguard-core = { path = "crates/core" }
netguard-platform = { path = "crates/platform" }
netguard-control = { path = "crates/control" }

[profile.release]
lto = "thin"
strip = true

